<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="simon.css" />
</head>
<body>
    <h1>Simon Says Game </h1>
    <h3> press any key to start the game </h3>

   <div class="scoreContainer">
     <h4 > your score : <span id='yourScore'>0</span></h4>
    <h4 > highest score : <span id='highestScore'>0</span></h4>
    </div>


    <div class="btncontainer"> 
        <div class="lineone">
    <div class="btn red" type="button" id="red"></div>
    <div class="btn blue" type="button" id="blue"></div>
    </div>
    <div class="line two">
    <div class="btn green" type="button" id="green"></div>
    <div class="btn brown" type="button" id="brown"></div>
    </div>
    </div>
    <script src="simon.js"></script>
</body>
</html>
